{% extends "base.html" %}
{% load bootstrap5 %}
{% block title %}Inscription - Life Pro Tips{% endblock %}
{% block content %}
<h2>Inscription</h2>
<form method="post" class="card card-body">
    {% csrf_token %}
    {% bootstrap_form form %}
    <button type="submit" class="btn btn-primary">S'inscrire</button>
</form>
<p class="mt-3"><a href="{% url 'login' %}">Déjà inscrit ? Connexion</a></p>
{% endblock %}
