{% extends "base.html" %}
{% block title %}Connexion - Life Pro Tips{% endblock %}
{% block content %}
<h2>Connexion</h2>
<form method="post" class="card card-body">
    {% csrf_token %}
    {% bootstrap_form form %}
    <button type="submit" class="btn btn-primary">Se connecter</button>
</form>
<p class="mt-3"><a href="{% url 'register' %}">Pas encore inscrit ? Inscription</a></p>
{% endblock %}
