<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>{{ room.name }} - Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        #messages {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #ccc;
            padding: 10px;
        }
        #user-list {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #aaa;
            padding: 10px;
        }
        .message {
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <h1>{{ room.name }}</h1>
    <div class="row">
        <div class="col-md-8">
            <div id="messages"></div>
            <form id="chat-form" class="mt-3">
                <div class="input-group">
                    <input type="text" id="message-input" class="form-control" placeholder="Message..." required>
                    <button type="submit" class="btn btn-primary">Send</button>
                </div>
            </form>
        </div>
        <div class="col-md-4">
            <h3>Connected users</h3>
            <div id="user-list"></div>
        </div>
    </div>
</div>

<script>
$(document).ready(function() {
    var roomId = {{ room.pk }};
    var protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
    var wsUrl = protocol + window.location.host + '/ws/chat/' + roomId + '/';
    var socket = new WebSocket(wsUrl);

    socket.onopen = function(e) {
        console.log('WebSocket connecté');
    };

    socket.onmessage = function(e) {
        var data = JSON.parse(e.data);

        if (data.type === 'history') {
            // Historique des messages (ex02)
            $.each(data.messages, function(i, msg) {
                var div = $('<div class="message"></div>');
                if (msg.username) {
                    div.text(msg.username + ': ' + msg.content);
                } else {
                    div.text(msg.content);
                }
                $('#messages').append(div);
            });
            $('#messages').scrollTop($('#messages')[0].scrollHeight);
        } else if (data.type === 'user_list') {
            // Liste des utilisateurs connectés (ex03)
            $('#user-list').empty();
            $.each(data.users, function(i, username) {
                $('#user-list').append('<div class="message">' + username + '</div>');
            });
        } else {
            // Message normal ou join/leave
            var div = $('<div class="message"></div>');
            if (data.username) {
                div.text(data.username + ': ' + data.message);
            } else {
                div.text(data.message);
            }
            $('#messages').append(div);
            $('#messages').scrollTop($('#messages')[0].scrollHeight);
        }
    };

    socket.onclose = function(e) {
        console.log('WebSocket fermé');
    };

    $('#chat-form').submit(function(e) {
        e.preventDefault();
        var message = $('#message-input').val();
        if (message) {
            socket.send(JSON.stringify({'message': message}));
            $('#message-input').val('');
        }
    });
});
</script>
</body>
</html>
