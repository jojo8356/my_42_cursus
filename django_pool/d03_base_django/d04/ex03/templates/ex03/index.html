<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ex03 : Fifty shades of bic.</title>
    <style>
        table { border-collapse: collapse; }
        td { width: 80px; height: 40px; border: 1px solid #333; }
        th { border: 1px solid #333; padding: 4px; }
    </style>
</head>
<body>
    <h1>Ex03 : Fifty shades of bic.</h1>
    <table>
        <tr>
            <th>noir</th>
            <th>rouge</th>
            <th>bleu</th>
            <th>vert</th>
        </tr>
        {% for row in rows %}
        <tr>
            <td style="background-color: {{ row.noir }};"></td>
            <td style="background-color: {{ row.rouge }};"></td>
            <td style="background-color: {{ row.bleu }};"></td>
            <td style="background-color: {{ row.vert }};"></td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
