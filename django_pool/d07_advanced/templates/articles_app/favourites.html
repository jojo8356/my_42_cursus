{% extends "articles_app/base.html" %}
{% load i18n %}
{% block title %}{% trans "Favourites" %}{% endblock %}
{% block content %}
<h1>{% trans "Favourites" %}</h1>
<ul class="list-group">
    {% for fav in favourites %}
    <li class="list-group-item">
        <a href="{% url 'article_detail' fav.article.pk %}">{{ fav.article.title }}</a>
    </li>
    {% endfor %}
</ul>
{% endblock %}
