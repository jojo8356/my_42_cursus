<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'en' }}">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Articles{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="{% url 'home' %}">Articles</a>
        <div class="navbar-nav me-auto">
            <a class="nav-link" href="{% url 'home' %}">Home</a>
            <a class="nav-link" href="{% url 'articles' %}">Last Articles</a>
        </div>
        <div class="navbar-nav">
            {% if user.is_authenticated %}
                <a class="nav-link" href="{% url 'favourites' %}">Favourites</a>
                <a class="nav-link" href="{% url 'publications' %}">Publications</a>
                <span class="nav-link">Logged as {{ user.username }}</span>
                <a class="nav-link" href="{% url 'logout' %}">Logout</a>
            {% else %}
                <a class="nav-link" href="{% url 'register' %}">Register</a>
                <form method="post" action="{% url 'login' %}" class="d-flex">
                    {% csrf_token %}
                    <input type="text" name="username" placeholder="Login" class="me-2">
                    <input type="password" name="password" placeholder="Password" class="me-2">
                    <button type="submit" class="btn btn-outline-light btn-sm">Login</button>
                </form>
            {% endif %}
        </div>
    </div>
</nav>
<main class="container mt-4">
    {% block content %}{% endblock %}
</main>
</body>
</html>
