<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ex01 : Display</title>
</head>
<body>
    <h1>Ex01 : Display</h1>
    <table>
        <tr>
            <th>Episode</th>
            <th>Title</th>
            <th>Director</th>
            <th>Producer</th>
            <th>Release date</th>
        </tr>
        {% for movie in movies %}
        <tr>
            <td>{{ movie.episode_nb }}</td>
            <td>{{ movie.title }}</td>
            <td>{{ movie.director }}</td>
            <td>{{ movie.producer }}</td>
            <td>{{ movie.release_date }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
