<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ex05 : Display</title>
    <style>
        table { border-collapse: collapse; }
        th, td { border: 1px solid #333; padding: 5px; }
    </style>
</head>
<body>
    <h1>Ex05 : Display</h1>
    <table>
        <tr>
            <th>episode_nb</th>
            <th>title</th>
            <th>director</th>
            <th>producer</th>
            <th>release_date</th>
        </tr>
        {% for movie in movies %}
        <tr>
            <td>{{ movie.episode_nb }}</td>
            <td>{{ movie.title }}</td>
            <td>{{ movie.director }}</td>
            <td>{{ movie.producer }}</td>
            <td>{{ movie.release_date }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
