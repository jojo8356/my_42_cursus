<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Formulaire de contact</title>
</head>
<body>
    <h1>Formulaire de contact</h1>
    <form>
        <div>
            <label for="firstname">Firstname :</label>
            <input type="text" id="firstname" name="firstname">
        </div>
        <div>
            <label for="name">Name :</label>
            <input type="text" id="name" name="name">
        </div>
        <div>
            <label for="age">Age :</label>
            <input type="number" id="age" name="age">
        </div>
        <div>
            <label for="phone">Phone :</label>
            <input type="tel" id="phone" name="phone">
        </div>
        <div>
            <label for="email">Email :</label>
            <input type="email" id="email" name="email">
        </div>
        <div>
            <label for="student">Student at 42 ?</label>
            <input type="checkbox" id="student" name="student">
        </div>
        <div>
            <span>Gender :</span>
            <label><input type="radio" name="gender" id="gender_male" value="Male"> Male</label>
            <label><input type="radio" name="gender" id="gender_female" value="Female"> Female</label>
            <label><input type="radio" name="gender" id="gender_other" value="Other"> Other</label>
        </div>
        <button type="button" onclick="displayFormContents();">Submit</button>
    </form>
    <script src="popup.js"></script>
</body>
</html>
