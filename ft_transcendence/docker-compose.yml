# One command to run the whole app:  docker-compose up --build
# Serves HTTPS (wss) on port 443, redirects HTTP (80) to HTTPS.
services:
  transcendence:
    build: .
    container_name: ft_transcendence
    ports:
      - "80:80"
      - "443:443"
    environment:
      DJANGO_SECURE: "1"
      DJANGO_DEBUG: "0"
      # Credentials live in .env (git-ignored), not committed (subject rule).
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production}
      POSTGRES_HOST: ${POSTGRES_HOST:-}
      POSTGRES_DB: ${POSTGRES_DB:-transcendence}
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    restart: unless-stopped
