# ============================================================================ #
#  ft_services — Telegraf configuration (BONUS)                               #
#  Collects system + docker metrics, outputs to InfluxDB.                   #
# ============================================================================ #
[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  hostname = "telegraf"
  omit_hostname = false

# --- System metrics ----------------------------------------------------------
[[inputs.cpu]]
  percpu = true
  totalcpu = true
  collect_cpu_time = false
  report_active = false

[[inputs.mem]]

[[inputs.disk]]

[[inputs.load]]

[[inputs.net]]

[[inputs.processes]]

[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"

# --- Output to InfluxDB ------------------------------------------------------
[[outputs.influxdb]]
  urls = ["http://influxdb:8086"]
  database = "telegraf"
  influx_uint_conversion = true
