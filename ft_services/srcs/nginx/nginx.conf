# ============================================================================ #
#  ft_services — NGINX configuration (reverse proxy + 307 redirect)         #
# ============================================================================ #
events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # HTTP -> HTTPS
    server {
        listen      80;
        server_name _;
        return 307 https://$host:443$request_uri;
    }

    # HTTPS : reverse proxy to phpMyAdmin + 307 redirect to WordPress
    server {
        listen      443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/nginx.crt;
        ssl_certificate_key /etc/nginx/ssl/nginx.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Reverse proxy to the phpMyAdmin container (port 5000)
        location /phpmyadmin {
            proxy_pass         http://phpmyadmin:5000/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # 307 redirect to the WordPress container (port 5050)
        location / {
            return 307 http://$host:5050$request_uri;
        }
    }
}
