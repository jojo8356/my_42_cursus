# ============================================================================ #
#  ft_services — proftpd configuration (FTPS)                                #
# ============================================================================ #
ServerName         ftp
ServerType         standalone
Listen             on
Listen             0.0.0.0
Port               21
User               root
Group              root
Umask              022
RequireValidShell  no
Idempotency         no

# --- FTP over SSL (FTPS) -----------------------------------------------------
<Global>
    <IfModule mod_tls.c>
        TLSEngine            on
        TLSLog               /var/log/proftpd/tls.log
        TLSProtocol          TLSv1.2
        TLSCipherSuite       HIGH:!aNULL:!MD5
        TLSRequired         on
        TLSVerifyClient     off
        TLSCertificateFile   /etc/proftpd/ssl/ftp.crt
        TLSCertificateKeyFile /etc/proftpd/ssl/ftp.key
    </IfModule>

    # Anonymous login disabled; real authenticated users only
    <Anonymous>
        RootLogin     off
        UserName     ftp
        RequireValidShell no
    </Anonymous>
</Global>

# --- Authenticated user (credentials from Kubernetes Secret) ---------------
<Directory /srv/ftp>
    <Auth>
        RequireValidShell off
        UserPasswordAuthenticate on
    </Auth>
    <Limit>
        Login         on
        WriteAccess   on
        CreateAccess  on
        DeleteAccess  on
        ReadAccess   on
    </Limit>
</Directory>
