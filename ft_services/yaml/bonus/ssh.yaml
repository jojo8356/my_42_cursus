# ============================================================================ #
#  ft_services — SSH Deployment + Service (BONUS: remote access)             #
#  Port 22. Credentials from Secret.                                         #
# ============================================================================ #
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssh
  labels:
    app: ssh
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ssh
  template:
    metadata:
      labels:
        app: ssh
    spec:
      containers:
        - name: ssh
          image: ssh:ft_services
          imagePullPolicy: Never
          ports:
            - containerPort: 22
          envFrom:
            - configMapRef:
                name: ft-services-config
            - secretRef:
                name: ft-services-secret
          livenessProbe:
            tcpSocket:
              port: 22
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: 22
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ssh
  labels:
    app: ssh
spec:
  type: LoadBalancer
  selector:
    app: ssh
  ports:
    - name: ssh
      port: 22
      targetPort: 22
