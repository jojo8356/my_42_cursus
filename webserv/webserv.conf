# webserv configuration — NGINX-style
server {
    listen 8080;
    server_name localhost;
    root ./www;
    index index.html;
    error_page 404 /error/404.html;
    error_page 403 /error/403.html;
    client_max_body_size 1m;

    location /static {
        root ./www;
        allow_methods GET HEAD;
    }

    location /cgi-bin {
        alias ./www/cgi-bin;
        cgi .py python3;
        cgi .pl perl;
    }

    location /upload {
        alias ./www/upload;
        upload_store ./www/upload;
        allow_methods POST DELETE;
    }

    location /redirect {
        return 301 /;
    }

    location /list {
        root ./www;
        autoindex on;
    }
}

server {
    listen 8081;
    server_name backup;
    root ./www;
    index index.html;
    error_page 404 /error/404.html;
}
