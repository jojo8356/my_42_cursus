# ============================================================================ #
#  Inception — docker-compose.yml (42 School)                                 #
#  Mandatory stack: NGINX (TLS :443) + WordPress/php-fpm (:9000) + MariaDB   #
#  (:3306). Bonus services are opt-in via the "bonus" profile.               #
# ============================================================================ #

services:
  # ---------------------------------------------------------------------------
  #  MariaDB — database only (no nginx), internal :3306
  # ---------------------------------------------------------------------------
  mariadb:
    container_name: mariadb
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    secrets:
      - db_password
      - db_root_password
    environment:
      DB_NAME: ${DB_DATABASE:-wordpress}
      DB_USER: ${DB_USER:-wordpress}
      DB_PORT: ${DB_PORT:-3306}
    restart: unless-stopped
    volumes:
      - vol-mariadb:/var/lib/mysql
    networks:
      - inception

  # ---------------------------------------------------------------------------
  #  WordPress + php-fpm — application only (no nginx), internal :9000
  # ---------------------------------------------------------------------------
  wordpress:
    container_name: wordpress
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    environment:
      WP_TITLE: ${WP_TITLE:-Inception}
      WP_ADMIN: ${WP_ADMIN:-inceptor}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:-}
      WP_USER: ${WP_USER:-contributor}
      WP_USER_EMAIL: ${WP_USER_EMAIL:-}
      DB_HOST: ${DB_HOST:-mariadb}
      DB_NAME: ${DB_DATABASE:-wordpress}
      DB_USER: ${DB_USER:-wordpress}
      DB_PORT: ${DB_PORT:-3306}
      WP_PORT: ${WP_PORT:-9000}
      DOMAIN_NAME: ${DOMAIN_NAME:-inception.42.fr}
      WP_PATH: ${WP_PATH:-/var/www/html}
    restart: unless-stopped
    depends_on:
      - mariadb
    volumes:
      - vol-wordpress:/var/www/html
    networks:
      - inception

  # ---------------------------------------------------------------------------
  #  NGINX — only public entry point, TLS :443 (TLS 1.2 / 1.3)
  # ---------------------------------------------------------------------------
  nginx:
    container_name: nginx
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    environment:
      NGINX_PORT: ${NGINX_PORT:-443}
      WP_PORT: ${WP_PORT:-9000}
      DOMAIN_NAME: ${DOMAIN_NAME:-inception.42.fr}
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-443}:443"
    depends_on:
      - wordpress
    volumes:
      - vol-wordpress:/var/www/html:ro
    networks:
      - inception

  # ===========================================================================
  #  BONUS services — enabled with: docker compose --profile bonus up -d
  # ===========================================================================

  # Bonus: Adminer — database administration interface
  adminer:
    container_name: adminer
    profiles: ["bonus"]
    build:
      context: ./requirements/bonus/adminer
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ADMINER_DB_HOST: ${DB_HOST:-mariadb}
      ADMINER_DB_NAME: ${DB_DATABASE:-wordpress}
      ADMINER_DB_USER: ${DB_USER:-wordpress}
    ports:
      - "8080:8080"
    depends_on:
      - mariadb
    networks:
      - inception

  # Bonus: Redis — in-memory cache / session store
  redis:
    container_name: redis
    profiles: ["bonus"]
    build:
      context: ./requirements/bonus/redis
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - inception

  # Bonus: FTP server (vsftpd)
  ftp:
    container_name: ftp
    profiles: ["bonus"]
    build:
      context: ./requirements/bonus/ftp
      dockerfile: Dockerfile
    secrets:
      - db_password
    environment:
      FTP_USER: ${FTP_USER:-ftpuser}
      FTP_PASSWORD: ${FTP_PASSWORD:-}
    restart: unless-stopped
    ports:
      - "21:21"
    volumes:
      - vol-ftp:/srv/ftp
    networks:
      - inception

  # Bonus: Personal static website
  website:
    container_name: website
    profiles: ["bonus"]
    build:
      context: ./requirements/bonus/website
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8081:80"
    networks:
      - inception

# -----------------------------------------------------------------------------
#  User-defined bridge network (no host network, no legacy links)
# -----------------------------------------------------------------------------
networks:
  inception:
    driver: bridge

# -----------------------------------------------------------------------------
#  Docker secrets — credentials mounted as files (never in env / git)
# -----------------------------------------------------------------------------
secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt

# -----------------------------------------------------------------------------
#  Named volumes pinned under /home/<login>/data (no direct bind mounts)
# -----------------------------------------------------------------------------
volumes:
  vol-mariadb:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/mariadb
  vol-wordpress:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/wordpress
  vol-ftp:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/ftp
