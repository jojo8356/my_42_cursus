# ============================================================================ #
#  vsftpd configuration — Inception (BONUS FTP)                              #
# ============================================================================ #
listen                 = YES
listen_ipv6            = NO
anonymous_enable       = NO
local_enable           = YES
write_enable           = YES
local_umask            = 022
dirmessage_enable      = YES
xferlog_enable         = YES
connect_from_port_20   = YES

# Passive mode for clients behind NAT
pasv_enable            = YES
pasv_min_port          = 40000
pasv_max_port          = 50000

# Local users are chrooted to their home directory
chroot_local_user      = YES
allow_writeable_chroot = YES

# Logging
log_ftp_protocol       = YES
xferlog_std_format     = YES
