# ============================================================================ #
#  NGINX configuration — Inception                                            #
#  - HTTPS only on 443, TLS 1.2 / 1.3 only                                    #
#  - Reverse proxy to WordPress/php-fpm via FastCGI on wordpress:9000        #
#  - Serves the shared WordPress volume read-only                            #
# ============================================================================ #

events {
    worker_processes auto;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # TLS 1.2 and 1.3 only — no older, weaker protocols
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers   HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    server {
        # Only public entry point: HTTPS on 443
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/nginx.crt;
        ssl_certificate_key /etc/nginx/certs/nginx.key;

        root  /var/www/html;
        index index.php index.html index.htm;

        location / {
            try_files $uri $uri/ =404;
        }

        # Forward .php requests to WordPress's php-fpm over the Docker network
        location ~ \.php$ {
            include        fastcgi_params;
            fastcgi_pass   wordpress:9000;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }
    }
}
