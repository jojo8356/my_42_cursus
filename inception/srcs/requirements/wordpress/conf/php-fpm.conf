# ============================================================================ #
#  php-fpm main configuration (WordPress container)                          #
#  Listens on TCP 9000 so NGINX can reach it over the Docker network.        #
# ============================================================================ #
[global]
error_log = /proc/self/fd/2
daemonize = no

[www]
; TCP listener — inter-container communication (not a Unix socket)
listen = 0.0.0.0:9000
user = www-data
group = www-data

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8

access.log = /proc/self/fd/2
catch_workers_output = yes
