# =============================================================================
#  vm.conf — single source of truth for the Born2beRoot virtual machine
# =============================================================================
#  Every setup script, the monitoring script's expectations and the whole test
#  suite read their values from this file, so there is exactly one place to
#  change the identity of the machine.
#
#  Format:  KEY="value"   (POSIX shell assignments, sourced by lib/common.sh)
# =============================================================================

# --- Identity ----------------------------------------------------------------
# The 42 login.  The hostname must be "<login>42" (subject v5.2, chapter V).
VM_LOGIN="jojo8356"
VM_HOSTNAME="${VM_LOGIN}42"
VM_DOMAIN="42.fr"

# Fully qualified name used by /etc/hosts and by lighttpd's server name.
VM_FQDN="${VM_HOSTNAME}.${VM_DOMAIN}"

# --- Operating system --------------------------------------------------------
# "debian" (default, recommended by the subject) or "rocky".
VM_OS="debian"
VM_OS_CODENAME="bookworm"
VM_OS_VERSION="12"

# --- Hardware sizing (VirtualBox, NAT) --------------------------------------
VM_RAM_MB="2048"
VM_VCPUS="1"
VM_DISK_GB="20"

# --- Ports -------------------------------------------------------------------
SSH_PORT="4242"
HTTP_PORT="80"
FTP_PORT="21"
FTP_PASSIVE_MIN="40000"
FTP_PASSIVE_MAX="40010"

# --- Partitioning (LVM on top of one LUKS container) ------------------------
# Sizes of the logical volumes, in gigabytes.  The sum must stay below
# VM_DISK_GB minus the /boot partition and the LVM metadata overhead.
LVM_VG="LVMGroup"
LUKS_NAME="sda5_crypt"
PART_BOOT_GB="1"
LV_ROOT_GB="6"
LV_SWAP_GB="2"
LV_HOME_GB="4"
LV_VAR_GB="2"
LV_SRV_GB="1"
LV_TMP_GB="1"
LV_VARLOG_GB="2.5"

# --- Users and groups --------------------------------------------------------
USER_GROUPS="sudo,user42"
EXTRA_GROUPS="user42"

# --- Security policies -------------------------------------------------------
PASS_MAX_DAYS="30"
PASS_MIN_DAYS="2"
PASS_WARN_AGE="7"
PASS_MIN_LEN="10"
PASS_MAX_REPEAT="3"
PASS_DIFOK="7"

SUDO_ATTEMPTS="3"
SUDO_LOG_DIR="/var/log/sudo"
SUDO_BADPASS_MESSAGE="Nice try. This incident has been logged, reported and judged."
SUDO_SECURE_PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/snap/bin"

APPARMOR_PROFILES="enforce"

# --- Services (mandatory + bonus) -------------------------------------------
MANDATORY_PACKAGES="openssh-server ufw sudo libpam-pwquality cron lvm2 apparmor apparmor-utils"
BONUS_PACKAGES="lighttpd mariadb-server php-cgi php-mysql wget vsftpd fail2ban"
BONUS_WP_DIR="/var/www/html"
BONUS_WP_DB="wordpress"
BONUS_WP_USER="wpuser"
BONUS_FTP_USER="ftpuser"

# --- Monitoring --------------------------------------------------------------
MONITORING_SCRIPT="/usr/local/bin/monitoring.sh"
MONITORING_CRON="*/10 * * * *"
MONITORING_LOG="/var/log/monitoring.log"
