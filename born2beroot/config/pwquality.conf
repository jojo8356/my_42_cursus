# =============================================================================
#  /etc/security/pwquality.conf — strong password policy (subject v5.2)
# =============================================================================
#  Requirement (chapter V)                                   -> directive
#  ---------------------------------------------------------------------------
#  at least 10 characters                                   -> minlen = 10
#  at least one uppercase letter                            -> ucredit = -1
#  at least one lowercase letter                            -> lcredit = -1
#  at least one digit                                       -> dcredit = -1
#  no more than 3 identical consecutive characters          -> maxrepeat = 3
#  the password must not contain the user name              -> usercheck = 1
#  root must obey the policy as well                        -> enforce_for_root
#  (also required, configured in /etc/pam.d/common-password) -> difok = 7
# =============================================================================

# Number of characters in the new password that must differ from the old one.
# The subject asks for at least 7 characters that were not in the previous
# password; difok is the pam_pwquality knob implementing exactly that.  It does
# not apply to root, which is what the subject requires.
difok = 7

# Minimum acceptable size of a new password.
minlen = 10

# Credits required for digits / upper / lower characters (-1 = at least one).
dcredit = -1
ucredit = -1
lcredit = -1

# Maximum number of identical consecutive characters.
maxrepeat = 3

# Reject a password that contains the user name (case insensitive).
usercheck = 1

# The root account is subject to the same rules.
enforce_for_root

# Refuse passwords that are based on a dictionary word or a reversed one.
dictcheck = 1

# Do not enforce a minimum number of different character classes.
minclass = 0
